<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F7F4EC; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span class="dsp" style="font-size: 13px; letter-spacing: 1.6px;">6 из 9 открыто</span>
  </div>

  <div class="dsp" style="font-size: 58px; line-height: 0.84; letter-spacing: -1px; padding: 0 16px 12px;">Снаряга</div>

  <!-- надето -->
  <div style="margin: 0 16px; border: 3px solid #111111; background: #FFC700; padding: 10px;">
    <div class="dsp" style="font-size: 11px; letter-spacing: 1.4px; margin-bottom: 8px;">Надето</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{worn}}" as="w" hint-placeholder-count="4">
        <div style="border: 3px solid #111111; background: #FFFFFF; padding: 7px 3px; text-align: center;">
          <div class="dsp" style="font-size: 9px; letter-spacing: 0.6px; color: #6B6459;">{{w.slot}}</div>
          <div class="dsp" style="font-size: 12px; line-height: 1.2; margin-top: 3px;">{{w.item}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="dsp" style="font-size: 11px; letter-spacing: 1.6px; padding: 16px 16px 8px;">Коллекция</div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
        <div onClick="{{it.pick}}" style="border: 3px solid #111111; background: {{it.bg}}; cursor: pointer; padding: 9px 6px 8px; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="width: 30px; height: 30px; border: 3px solid #111111; background: {{it.iconBg}}; display: flex; align-items: center; justify-content: center;">
              <div class="dsp" style="font-size: 14px; color: #111111;">{{it.mark}}</div>
            </div>
            <sc-if value="{{it.locked}}" hint-placeholder-val="{{ true }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            </sc-if>
          </div>
          <div>
            <div class="dsp" style="font-size: 13px; line-height: 1.1; color: {{it.fg}};">{{it.name}}</div>
            <div style="font-size: 10px; line-height: 1.25; margin-top: 3px; font-weight: 500; color: {{it.subFg}};">{{it.cond}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="border-top: 3px solid #111111; background: #111111; color: #F7F4EC; padding: 12px 16px 16px;">
    <div class="dsp" style="font-size: 12px; letter-spacing: 1.4px; color: #FFC700;">{{selName}}</div>
    <div style="font-size: 12px; line-height: 1.4; margin-top: 4px; font-weight: 500;">{{selDesc}}</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'belt_white' };
  }

  renderVals() {
    const defs = [
      { id: 'belt_white', name: 'Белый пояс', mark: 'I', cond: 'Получен', color: '#FFFFFF', locked: false,
        desc: 'Стартовый. Меняется только тогда, когда пояс меняется в зале, а не когда набежал опыт.' },
      { id: 'gi', name: 'Ги', mark: 'II', cond: 'Получен', color: '#FFFFFF', locked: false,
        desc: 'Открылось на десятой тренировке на мате.' },
      { id: 'rash', name: 'Рашгард', mark: 'III', cond: 'Получен', color: '#2F6BFF', locked: false,
        desc: 'Ноу-ги, борьба без кимоно. Открылся за 5 сессий подряд без пропуска.' },
      { id: 'knee', name: 'Наколенники', mark: 'IV', cond: '6 из 8 недель', color: '#FFC700', locked: false,
        desc: 'Восемь недель без пропуска силовой. Осталось две.' },
      { id: 'shoes', name: 'Кроссы', mark: 'V', cond: '80 из 100 км', color: '#3FBF5F', locked: false,
        desc: 'Сто километров бега за блок. Осталось двадцать.' },
      { id: 'band', name: 'Хатимаки', mark: 'VI', cond: 'Изометрия ×30', color: '#FF5A3C', locked: false,
        desc: 'Тридцать сессий шеи. Самая скучная вещь в системе и самая полезная для мата.' },
      { id: 'belt_blue', name: 'Синий пояс', mark: 'VII', cond: 'Реальный пояс', color: null, locked: true,
        desc: 'Не выбивается опытом. Отмечается вручную в тот день, когда тебе его повяжут.' },
      { id: 'grip', name: 'Хват стали', mark: 'VIII', cond: 'Вис 120 сек', color: null, locked: true,
        desc: 'Две минуты на перекладине одним подходом. Сейчас лучший результат 47 секунд.' },
      { id: 'crown', name: 'Венок', mark: 'IX', cond: 'Блок закрыт', color: null, locked: true,
        desc: 'Все четыре условия смены блока выполнены. Греческая статуя, как заказывал.' },
    ];

    const items = defs.map((d) => ({
      name: d.name,
      mark: d.mark,
      cond: d.cond,
      locked: d.locked,
      bg: d.locked ? '#E4E0D5' : (d.id === this.state.sel ? '#111111' : '#FFFFFF'),
      fg: (!d.locked && d.id === this.state.sel) ? '#F7F4EC' : '#111111',
      subFg: (!d.locked && d.id === this.state.sel) ? '#C9C3B6' : '#4A463E',
      iconBg: d.locked ? '#E4E0D5' : (d.color || '#FFFFFF'),
      pick: () => this.setState({ sel: d.id }),
    }));

    const sel = defs.find((d) => d.id === this.state.sel) || defs[0];

    return {
      items,
      selName: sel.name,
      selDesc: sel.desc,
      worn: [
        { slot: 'Голова', item: 'Пусто' },
        { slot: 'Тело', item: 'Ги' },
        { slot: 'Пояс', item: 'Белый' },
        { slot: 'Ноги', item: 'Босиком' },
      ],
    };
  }
}
</script>
</body>
</html>
