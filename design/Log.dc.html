<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F7F4EC; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 18px 16px 10px;">
    <div>
      <div class="dsp" style="font-size: 52px; line-height: 0.84; letter-spacing: -1px;">Вторник</div>
      <div style="font-size: 12px; font-weight: 500; color: #6B6459; margin-top: 2px;">Мат, потом железо. Тяжёлый день недели.</div>
    </div>
  </div>

  <!-- план на сегодня -->
  <div style="margin: 4px 16px 0; border: 3px solid #111111; background: #FF5A3C;">
    <div style="padding: 11px 12px 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="dsp" style="font-size: 11px; letter-spacing: 1.4px;">План от тренера</span>
        <span class="dsp" style="font-size: 13px;">A · после мата</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0; margin-top: 8px;">
        <sc-for list="{{plan}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; gap: 10px; border-top: 2px solid #111111; padding: 6px 0; font-size: 13px; font-weight: 600;">
            <span>{{p.ex}}</span>
            <span class="dsp" style="font-size: 13px;">{{p.sets}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="border-top: 3px solid #111111; background: #111111; color: #F7F4EC; padding: 13px; text-align: center;">
      <span class="dsp" style="font-size: 15px; letter-spacing: 1.4px;">Начать по плану</span>
    </div>
  </div>

  <!-- записать -->
  <div class="dsp" style="font-size: 11px; letter-spacing: 1.6px; padding: 16px 16px 8px;">Записать</div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 16px;">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
      <div style="border: 3px solid #111111; background: {{t.color}}; min-height: 56px; display: flex; align-items: flex-end; padding: 8px;">
        <div class="dsp" style="font-size: 12px; line-height: 1.05; letter-spacing: 0.2px; overflow-wrap: anywhere; color: {{t.fg}};">{{t.name}}</div>
      </div>
    </sc-for>
  </div>

  <!-- неделя -->
  <div class="dsp" style="font-size: 11px; letter-spacing: 1.6px; padding: 16px 16px 8px;">Неделя · 2149</div>
  <div style="margin: 0 16px; border: 3px solid #111111; background: #FFFFFF; padding: 12px 10px 10px;">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; align-items: end; height: 74px;">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: {{d.h}}; background: {{d.color}}; border: 3px solid #111111;"></div>
          <span class="dsp" style="font-size: 10px; color: {{d.labelColor}};">{{d.day}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 3px solid #111111; margin-top: 10px; padding-top: 9px;">
      <div>
        <div class="dsp" style="font-size: 26px; line-height: 1;">1.15</div>
        <div style="font-size: 10px; font-weight: 500; color: #6B6459;">острая к хронической</div>
      </div>
      <div style="border: 3px solid #111111; background: #3FBF5F; padding: 6px 10px;">
        <span class="dsp" style="font-size: 12px; letter-spacing: 1px;">В коридоре</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px solid #111111; margin-top: auto;">
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.5-6 7-6s7 2 7 6"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Герой</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #FFC700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Лог</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-7-4-7 4z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Квесты</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 5-3 8-7 9-4-1-7-4-7-9V7z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Снаряга</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      plan: [
        { ex: 'Румынская тяга', sets: '3×6 · 65' },
        { ex: 'Жим гантелей', sets: '3×8 · 22' },
        { ex: 'Тяга гантели', sets: '3×8 · 24' },
        { ex: 'Изометрия шеи', sets: '2×25 сек' },
      ],
      types: [
        { name: 'Силовая', color: '#FF5A3C', fg: '#111111' },
        { name: 'БЖЖ', color: '#2F6BFF', fg: '#FFFFFF' },
        { name: 'Бег', color: '#3FBF5F', fg: '#111111' },
        { name: 'Калистеника', color: '#FFC700', fg: '#111111' },
        { name: 'Мобильность', color: '#B569FF', fg: '#111111' },
        { name: 'Вес', color: '#FFFFFF', fg: '#111111' },
      ],
      week: [
        { day: 'Ср', h: '22px', color: '#3FBF5F', labelColor: '#6B6459' },
        { day: 'Чт', h: '52px', color: '#2F6BFF', labelColor: '#6B6459' },
        { day: 'Пт', h: '22px', color: '#3FBF5F', labelColor: '#6B6459' },
        { day: 'Сб', h: '12px', color: '#FFFFFF', labelColor: '#6B6459' },
        { day: 'Вс', h: '46px', color: '#2F6BFF', labelColor: '#6B6459' },
        { day: 'Пн', h: '20px', color: '#3FBF5F', labelColor: '#6B6459' },
        { day: 'Вт', h: '38px', color: '#2F6BFF', labelColor: '#111111' },
      ],
    };
  }
}
</script>
</body>
</html>
