<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #635BDF; } a:hover { color: #252323; }
    .dsp { font-family: Unbounded, Impact, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .tap { transition: transform 130ms cubic-bezier(.2,.8,.2,1), background-color 130ms ease; cursor: pointer; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .bob { animation: bob 3.4s ease-in-out infinite; }
    /* слои персонажа лежат на одной сетке 512x768 и просто кладутся друг на друга */
    .lay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #FFFFFF; color: #252323; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0;">
    <div class="dsp" style="font-size: 28px;">Гардероб</div>
    <div style="background: #F4F4F8; border-radius: 999px; padding: 8px 14px;">
      <span class="lbl" style="color: #6E6A68;">{{owned}}</span>
    </div>
  </div>

  <!-- примерочная. Фон не мятный: мятное худи и мятные трусы на нём пропадают -->
  <div style="position: relative; height: 232px; margin-top: 8px; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; width: 212px; height: 212px; border-radius: 106px; background: #E4E2F5;"></div>
    <div class="bob" style="position: relative; width: 150px; height: 226px;">
      <sc-for list="{{worn}}" as="w" hint-placeholder-count="2">
        <img class="lay" src="{{w.src}}">
      </sc-for>
    </div>
  </div>

  <!-- три слота: трусы это тело, образ надевается целиком, причёска сверху -->
  <div style="display: flex; gap: 6px; padding: 8px 20px 0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <div class="tap" onClick="{{t.pick}}" style="flex-grow: 1; text-align: center; background: {{t.bg}}; color: {{t.fg}}; border-radius: 999px; padding: 14px 0;">
        <div class="lbl">{{t.name}}</div>
        <div style="font-size: 11px; font-weight: 600; margin-top: 2px; opacity: 0.75;">{{t.cur}}</div>
      </div>
    </sc-for>
  </div>

  <!-- сетка вещей -->
  <div style="flex-grow: 1; min-height: 0; padding: 12px 20px 10px; overflow-y: auto;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
        <div class="tap" onClick="{{it.pick}}" style="background: {{it.bg}}; border-radius: 20px; padding: 8px; border: 2px solid {{it.border}};">
          <div style="height: 76px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <img src="{{it.thumb}}" style="height: {{it.thumbH}}; object-fit: contain; opacity: {{it.dim}};">
          </div>
          <div class="dsp" style="font-size: 12px; line-height: 1.1; margin-top: 4px;">{{it.name}}</div>
          <div style="font-size: 10px; font-weight: 600; margin-top: 3px; color: {{it.subFg}}; line-height: 1.25;">{{it.cond}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- подпись выбранного и действие -->
  <div style="background: #F4F4F8; border-radius: 26px 26px 0 0; padding: 14px 20px 20px; flex-shrink: 0;">
    <div class="dsp" style="font-size: 16px;">{{selName}}</div>
    <div style="font-size: 12px; font-weight: 500; color: #6E6A68; margin-top: 5px; line-height: 1.4;">{{selDesc}}</div>
    <div class="tap" style="background: {{ctaBg}}; color: {{ctaFg}}; border-radius: 999px; height: 54px; margin-top: 12px; display: flex; align-items: center; justify-content: center;">
      <span class="dsp" style="font-size: 16px;">{{ctaText}}</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'outfit', body: 'leopard', outfit: 'bandtee', hair: 'curly', sel: 'bandtee' };
  }

  renderVals() {
    // Одежда пришла нарисованной вместе с телом, разделить верх и низ нельзя.
    // Поэтому слот не «верх/низ», а «образ целиком»; надетый образ скрывает трусы.
    const ALL = {
      pants: [
        { id: 'leopard', name: 'Леопард',  cond: 'Стартовые', desc: 'Леопард. Мы все здесь начинали.', locked: false },
        { id: 'black',   name: 'Чёрные',   cond: 'Стартовые', desc: 'База. Ничего лишнего.', locked: false },
        { id: 'white',   name: 'Белые',    cond: 'Стартовые', desc: 'База. Ничего лишнего.', locked: false },
        { id: 'stripes', name: 'Полоска',  cond: 'Стартовые', desc: 'База. Ничего лишнего.', locked: false },
        { id: 'mint',    name: 'Мятные',   cond: 'Стартовые', desc: 'База. Ничего лишнего.', locked: false },
        { id: 'hearts',  name: 'Сердечки', cond: 'Открыты',   desc: 'Первая неделя без пропуска силовой.', locked: false },
        { id: 'flames',  name: 'Огонь',    cond: 'Уровень 3', desc: 'Ждут на третьем уровне.', locked: true },
        { id: 'banana',  name: 'Бананы',   cond: 'Уровень 5', desc: 'Ждут на пятом уровне.', locked: true },
      ],
      outfit: [
        { id: 'none',    name: 'Без одежды', cond: 'Стартовый', desc: 'Как есть. Ничего постыдного.', locked: false },
        { id: 'bandtee', name: 'Бэнд-ти',   cond: 'Открыт',     desc: 'Оверсайз с черепом плюс широкие джинсы. За десять записанных сессий.', locked: false },
        { id: 'hoodie',  name: 'Худи',      cond: 'Открыт',     desc: 'Мятное худи и карго. Четыре недели без пропуска силовой.', locked: false },
        { id: 'tank',    name: 'Майка',     cond: 'Открыт',     desc: 'Белая майка и шорты. За двадцать подходов, записанных с запасом.', locked: false },
        { id: 'rash',    name: 'Рашгард',   cond: 'Открыт',     desc: 'Ноу-ги комплект. За пять недель мата подряд.', locked: false },
        { id: 'crew',    name: 'Свитшот',   cond: '6 из 8 нед', desc: 'CIRCUS STUFF и рваные джинсы. Восемь недель блока целиком, осталось две.', locked: true },
        { id: 'biker',   name: 'Косуха',    cond: 'Уровень 8',  desc: 'Косуха, белая футболка, чёрные джинсы. Четыре уровня впереди.', locked: true },
      ],
      hair: [
        { id: 'bald',      name: 'Лысый',      cond: 'Стартовый', desc: 'База. Причёска надевается поверх.', locked: false },
        { id: 'buzz',      name: 'Короткие',   cond: 'Стартовые', desc: 'Ёжик. Ничего не мешает на мате.', locked: false },
        { id: 'curly',     name: 'Кудри',      cond: 'Открыты',   desc: 'Тёмные кудри. За вторую неделю подряд.', locked: false },
        { id: 'blond',     name: 'Блонд',      cond: 'Уровень 6', desc: 'Осветлённый лохматый. Два уровня впереди.', locked: true },
        { id: 'braids',    name: 'Брейды',     cond: '10 нед мата', desc: 'Косички. Десять недель мата без пропуска.', locked: true },
        { id: 'long',      name: 'Длинные',    cond: 'Уровень 7', desc: 'Прямые длинные.', locked: true },
        { id: 'longcurly', name: 'Длин. кудри', cond: 'Уровень 9', desc: 'Длинные кудрявые.', locked: true },
      ],
    };
    const SLOT_OF = { pants: 'body', outfit: 'outfit', hair: 'hair' };

    const list = ALL[this.state.tab];
    const sel = Object.values(ALL).flat().find((i) => i.id === this.state.sel) || list[0];
    const unlocked = Object.values(ALL).flat().filter((i) => !i.locked).length;
    const total = Object.values(ALL).flat().length;

    // видно ровно то, что надето: образ перекрывает трусы, причёска ложится сверху
    const worn = [];
    if (this.state.outfit === 'none') worn.push({ src: `l-${this.state.body}.png` });
    else worn.push({ src: `l-${this.state.outfit}.png` });
    if (this.state.hair !== 'bald') worn.push({ src: `l-${this.state.hair}.png` });

    const curName = (k) => (ALL[k].find((i) => i.id === this.state[SLOT_OF[k]]) || ALL[k][0]).name;

    return {
      owned: `${unlocked} из ${total}`,
      worn,
      tabs: [
        { id: 'pants',  name: 'Трусы' },
        { id: 'outfit', name: 'Образ' },
        { id: 'hair',   name: 'Причёска' },
      ].map((t) => ({
        name: t.name,
        cur: curName(t.id),
        bg: this.state.tab === t.id ? '#252323' : '#F4F4F8',
        fg: this.state.tab === t.id ? '#FFFFFF' : '#6E6A68',
        pick: () => this.setState({ tab: t.id }),
      })),
      items: list.map((i) => {
        const on = i.id === this.state[SLOT_OF[this.state.tab]];
        const isHair = this.state.tab === 'hair';
        return {
          name: i.name,
          cond: i.cond,
          thumb: i.id === 'none' ? `t-${this.state.body}.png` : (isHair ? (i.id === 'bald' ? `t-${this.state.body}.png` : `h-${i.id}.png`) : `t-${i.id}.png`),
          thumbH: isHair && i.id !== 'bald' ? '58px' : '74px',
          dim: i.locked ? '0.34' : '1',
          bg: on ? '#8EFF8E' : (i.locked ? '#FAFAFC' : '#F4F4F8'),
          border: on ? '#252323' : 'transparent',
          subFg: on ? '#2C4A2C' : '#6E6A68',
          pick: () => this.setState(i.locked
            ? { sel: i.id }
            : { sel: i.id, [SLOT_OF[this.state.tab]]: i.id }),
        };
      }),
      selName: sel.name,
      selDesc: sel.desc,
      ctaText: sel.locked ? 'Ещё закрыто' : 'Надето',
      ctaBg: sel.locked ? '#E4E4EE' : '#252323',
      ctaFg: sel.locked ? '#6E6A68' : '#8EFF8E',
    };
  }
}
</script>
</body>
</html>
