<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF4D26; } a:hover { color: #16151A; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; font-weight: 700; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F5F2EA; color: #16151A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- шапка: только контекст, ничего кликабельного кроме профиля -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 0;">
    <div class="lbl" style="color: #8A8579;">Вторник · неделя 3</div>
    <div style="width: 32px; height: 32px; border-radius: 16px; background: #16151A;"></div>
  </div>

  <!-- доминанта экрана: что делаем сегодня -->
  <div style="padding: 12px 24px 0;">
    <div class="dsp" style="font-size: 46px; line-height: 0.94; letter-spacing: -0.5px;">Мат,<br>потом железо</div>
  </div>

  <!-- главное действие: плоское поле, без рамок -->
  <div style="background: #FF4D26; margin-top: 24px; padding: 20px 24px 24px;">
    <div class="lbl" style="color: #16151A; opacity: 0.65;">План от тренера</div>
    <div class="dsp" style="font-size: 24px; line-height: 1.05; margin-top: 6px;">A · Сила после мата</div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{plan}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
          <span style="font-size: 15px; font-weight: 500;">{{p.ex}}</span>
          <span class="num" style="font-size: 15px; font-weight: 600; white-space: nowrap;">{{p.sets}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 20px; background: #16151A; color: #F5F2EA; height: 56px; display: flex; align-items: center; justify-content: center;">
      <span class="dsp" style="font-size: 17px; letter-spacing: 0.5px;">Начать</span>
    </div>
    <div style="font-size: 13px; margin-top: 12px; line-height: 1.4; opacity: 0.75;">
      Мат был тяжёлый? Режь до трёх упражнений, тренер поймёт.
    </div>
  </div>

  <!-- второстепенное: тихие строки, без плиток и рамок -->
  <div style="padding: 24px 24px 0;">
    <div class="lbl" style="color: #8A8579;">Записать вручную</div>
    <div style="margin-top: 12px;">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E2DED2;">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: {{t.dot}};"></div>
          <span style="font-size: 15px; font-weight: 500; flex-grow: 1;">{{t.name}}</span>
          <span class="num" style="font-size: 13px; color: #8A8579;">{{t.last}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- нагрузка: одна цифра, без графика -->
  <div style="padding: 20px 24px 0; display: flex; align-items: flex-end; justify-content: space-between;">
    <div>
      <div class="lbl" style="color: #8A8579;">Нагрузка недели</div>
      <div class="dsp num" style="font-size: 34px; line-height: 1; margin-top: 4px;">2 149</div>
    </div>
    <div style="text-align: right; padding-bottom: 4px;">
      <div class="num" style="font-size: 15px; font-weight: 600; color: #2E7D4F;">1.15</div>
      <div style="font-size: 12px; color: #8A8579;">в коридоре</div>
    </div>
  </div>

  <!-- навигация: текст, без иконок и заливок -->
  <div style="margin-top: auto; border-top: 1px solid #E2DED2; display: flex;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div style="flex-grow: 1; text-align: center; padding: 16px 0 22px;">
        <span class="lbl" style="color: {{n.color}};">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      plan: [
        { ex: 'Румынская тяга', sets: '3 × 6 · 65' },
        { ex: 'Жим гантелей', sets: '3 × 8 · 22' },
        { ex: 'Тяга гантели', sets: '3 × 8 · 24' },
        { ex: 'Изометрия шеи', sets: '2 × 25 сек' },
      ],
      types: [
        { name: 'БЖЖ', dot: '#2F5FD0', last: 'вчера' },
        { name: 'Бег', dot: '#2E7D4F', last: '3 дня назад' },
        { name: 'Мобильность', dot: '#7B52C4', last: '5 дней назад' },
        { name: 'Вес', dot: '#8A8579', last: '84.6 кг' },
      ],
      nav: [
        { name: 'Сегодня', color: '#16151A' },
        { name: 'Герой', color: '#8A8579' },
        { name: 'Прогресс', color: '#8A8579' },
        { name: 'Профиль', color: '#8A8579' },
      ],
    };
  }
}
</script>
</body>
</html>
