<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #635BDF; } a:hover { color: #252323; }
    .dsp { font-family: Unbounded, Impact, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
    .tap { transition: transform 140ms cubic-bezier(.2,.8,.2,1); cursor: pointer; }
    @keyframes ring { from { stroke-dashoffset: 226; } to { stroke-dashoffset: var(--off); } }
    .ring { animation: ring 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pop { animation: pop 420ms cubic-bezier(.2,.9,.3,1) both; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-3px) rotate(3deg); } }
    .bob { animation: bob 3s ease-in-out infinite; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #FFFFFF; color: #252323; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0;">
    <div>
      <div class="lbl" style="color: #6E6A68;">Вторник · неделя 3</div>
      <div class="dsp" style="font-size: 30px; line-height: 1; margin-top: 6px;">Привет, Гора</div>
    </div>
    <!-- персонаж вместо голой цифры уровня: тап зовёт тренера сам -->
    <div class="tap" style="position: relative; width: 52px; height: 52px; border-radius: 18px; background: #8EFF8E; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <div class="bob" style="width: 30px; height: 38px; border-radius: 9px; border: 2px dashed #3F8F3F; background: rgba(255,255,255,0.5);"></div>
      <div style="position: absolute; right: -5px; bottom: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: #252323; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <span class="dsp num" style="font-size: 11px; color: #8EFF8E;">4</span>
      </div>
    </div>
  </div>

  <!-- переключатель, живой -->
  <div style="display: flex; gap: 6px; padding: 12px 20px 0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <div class="tap" onClick="{{t.pick}}" style="background: {{t.bg}}; color: {{t.fg}}; border-radius: 999px; padding: 16px 18px;">
        <span class="lbl">{{t.name}}</span>
      </div>
    </sc-for>
  </div>

  <!-- мятный блок плана: главное действие -->
  <div class="pop" style="background: #8EFF8E; border-radius: 26px; margin: 8px 16px 0; padding: 14px 20px 14px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div>
        <div class="lbl" style="color: #2C6B2C;">План на сегодня</div>
        <div class="dsp" style="font-size: 25px; line-height: 1.05; margin-top: 6px;">Сила<br>после мата</div>
      </div>
      <!-- кольцо готовности: тоже интерактив -->
      <svg width="76" height="76" viewBox="0 0 80 80" style="flex-shrink: 0;">
        <circle cx="40" cy="40" r="36" fill="none" stroke="#6FE06F" stroke-width="8"/>
        <circle class="ring" cx="40" cy="40" r="36" fill="none" stroke="#252323" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="226" style="--off: 158;" stroke-dashoffset="158"
                transform="rotate(-90 40 40)"/>
        <text x="40" y="45" text-anchor="middle" class="dsp" font-size="17" fill="#252323">30%</text>
      </svg>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 1px; border-radius: 16px; overflow: hidden;">
      <sc-for list="{{plan}}" as="p" hint-placeholder-count="4">
        <div class="tap" onClick="{{p.toggle}}" style="background: {{p.bg}}; padding: 14px 14px; display: flex; align-items: center; gap: 10px;">
          <div style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #252323; background: {{p.dot}}; flex-shrink: 0;"></div>
          <span style="font-size: 14px; font-weight: 600; flex-grow: 1; text-decoration: {{p.line}};">{{p.ex}}</span>
          <span class="num" style="font-size: 13px; font-weight: 600; color: #2C4A2C;">{{p.sets}}</span>
        </div>
      </sc-for>
    </div>

    <div class="tap" style="background: #252323; color: #8EFF8E; border-radius: 999px; height: 52px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span class="dsp" style="font-size: 17px;">Поехали</span>
      <span class="dsp" style="font-size: 20px;">→</span>
    </div>
  </div>

  <!-- быстрый лог: пилюли -->
  <div style="padding: 12px 20px 0;">
    <div class="lbl" style="color: #6E6A68;">Записать быстро</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 12px;">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
        <div class="tap" style="background: {{q.bg}}; color: {{q.fg}}; border-radius: 18px; padding: 11px 6px; text-align: center;">
          <div class="dsp" style="font-size: 13px;">{{q.name}}</div>
          <div class="lbl" style="font-size: 9px; letter-spacing: 0.6px; margin-top: 3px; color: {{q.subFg}};">{{q.last}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- вход в «не тяну»: без него шит из макета некому открыть -->
  <div class="tap" style="margin: 12px 16px 0; background: #F4F4F8; border-radius: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 14px; font-weight: 600; flex-grow: 1;">Сегодня не тяну</span>
    <span class="lbl" style="color: #6E6A68;">поменять план</span>
    <span class="dsp" style="font-size: 14px; color: #6E6A68;">→</span>
  </div>

  <!-- нагрузка: тонко, без графиков -->
  <div style="margin: auto 16px 0; background: #F4F4F8; border-radius: 24px; padding: 12px 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div class="lbl" style="color: #6E6A68;">Нагрузка недели</div>
        <div class="dsp num" style="font-size: 30px; line-height: 1; margin-top: 4px;">2 149</div>
      </div>
      <div style="background: #9F9FED; color: #252323; border-radius: 999px; padding: 8px 14px;">
        <span class="dsp num" style="font-size: 14px;">1.15</span>
      </div>
    </div>
    <div style="height: 8px; background: #E4E4EE; border-radius: 4px; margin-top: 14px; position: relative;">
      <div style="position: absolute; left: 20%; right: 20%; top: 0; bottom: 0; background: #C9C9F0; border-radius: 4px;"></div>
      <div style="position: absolute; left: 58%; top: -4px; width: 16px; height: 16px; border-radius: 8px; background: #635BDF; border: 3px solid #FFFFFF;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px;">
      <span class="lbl" style="color: #6E6A68;">спад</span>
      <span class="lbl" style="color: #635BDF;">коридор</span>
      <span class="lbl" style="color: #6E6A68;">перебор</span>
    </div>
  </div>

  <div style="display: flex; padding: 10px 16px 16px; gap: 6px;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div class="tap" style="flex-grow: 1; text-align: center; padding: 16px 0; border-radius: 999px; background: {{n.bg}};">
        <span class="lbl" style="color: {{n.fg}};">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'day', done: { 0: false, 1: false, 2: false, 3: false } };
  }

  renderVals() {
    const items = [
      { ex: 'Румынская тяга', sets: '3 × 6 · 65' },
      { ex: 'Жим гантелей', sets: '3 × 8 · 22' },
      { ex: 'Тяга гантели', sets: '3 × 8 · 24' },
      { ex: 'Изометрия шеи', sets: '2 × 25 сек' },
    ];
    return {
      tabs: [
        { id: 'day', name: 'Сегодня' },
        { id: 'week', name: 'Вся неделя' },
      ].map((t) => ({
        name: t.name,
        bg: this.state.tab === t.id ? '#252323' : '#F4F4F8',
        fg: this.state.tab === t.id ? '#FFFFFF' : '#6E6A68',
        pick: () => this.setState({ tab: t.id }),
      })),
      plan: items.map((it, i) => {
        const on = this.state.done[i];
        return {
          ex: it.ex,
          sets: it.sets,
          bg: on ? '#6FE06F' : '#A8FFA8',
          dot: on ? '#252323' : 'transparent',
          line: on ? 'line-through' : 'none',
          toggle: () => this.setState({ done: { ...this.state.done, [i]: !on } }),
        };
      }),
      // подпись «когда в последний раз» своим цветом на каждом фоне:
      // единый серый на фиолете и мяте не добирает контраст
      quick: [
        { name: 'БЖЖ', bg: '#635BDF', fg: '#FFFFFF', subFg: '#FFFFFF', last: 'вчера' },
        { name: 'Бег', bg: '#8EFF8E', fg: '#252323', subFg: '#2C4A2C', last: '3 дня' },
        { name: 'Мобилка', bg: '#9F9FED', fg: '#252323', subFg: '#332F63', last: '5 дней' },
      ],
      nav: [
        { name: 'Сегодня', bg: '#8EFF8E', fg: '#252323' },
        { name: 'Герой', bg: '#F4F4F8', fg: '#6E6A68' },
        { name: 'Прогресс', bg: '#F4F4F8', fg: '#6E6A68' },
        { name: 'Я', bg: '#F4F4F8', fg: '#6E6A68' },
      ],
    };
  }
}
</script>
</body>
</html>
