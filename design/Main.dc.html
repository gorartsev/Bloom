<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .chip { border: 3px solid #111111; cursor: pointer; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F7F4EC; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <!-- шапка -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #111111; display: flex; align-items: center; justify-content: center;">
        <div style="width: 9px; height: 9px; background: #FFC700;"></div>
      </div>
      <span class="dsp" style="font-size: 18px; letter-spacing: 0.5px;">Bloom</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: #111111; color: #F7F4EC; padding: 5px 9px;">
        <span class="dsp" style="font-size: 12px; letter-spacing: 1px;">Свеж</span>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </div>
  </div>

  <!-- имя и уровень -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 10px;">
    <div class="dsp" style="font-size: 62px; line-height: 0.82; letter-spacing: -1px;">Гора</div>
    <div style="background: #FF5A3C; border: 3px solid #111111; padding: 4px 10px 6px; text-align: center;">
      <div class="dsp" style="font-size: 10px; letter-spacing: 1.4px; line-height: 1;">Лвл</div>
      <div class="dsp" style="font-size: 30px; line-height: 0.9;">4</div>
    </div>
  </div>

  <!-- персонаж -->
  <div style="position: relative; margin: 0 16px; border: 3px solid #111111; background: {{stageColor}}; height: 292px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
    <div style="position: absolute; left: 0; top: 0; background: #111111; color: #F7F4EC; padding: 4px 9px;">
      <span class="dsp" style="font-size: 11px; letter-spacing: 1.4px;">{{beltName}} пояс</span>
    </div>
    <svg width="216" height="248" viewBox="0 0 200 230" style="display: block;">
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M80 166 L75 206 M120 166 L125 206" stroke="#111111" stroke-width="28" fill="none"/>
        <path d="M80 166 L75 206 M120 166 L125 206" stroke="#F3EEE0" stroke-width="22" fill="none"/>
        <rect x="52" y="198" width="42" height="20" rx="6" fill="#111111" stroke="#111111" stroke-width="5"/>
        <rect x="106" y="198" width="42" height="20" rx="6" fill="#111111" stroke="#111111" stroke-width="5"/>
        <path d="M68 104 L46 150 M132 104 L154 150" stroke="#111111" stroke-width="28" fill="none"/>
        <path d="M68 104 L46 150 M132 104 L154 150" stroke="#F3EEE0" stroke-width="20" fill="none"/>
        <circle cx="44" cy="155" r="12" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <circle cx="156" cy="155" r="12" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <path d="M100 84 L66 96 L62 172 H138 L134 96 Z" fill="#F3EEE0" stroke="#111111" stroke-width="5"/>
        <path d="M100 84 L84 132 M100 84 L116 132" stroke="#111111" stroke-width="5" fill="none"/>
        <rect x="60" y="136" width="80" height="18" fill="{{beltColor}}" stroke="#111111" stroke-width="5"/>
        <path d="M94 154 v20 M108 154 v15" stroke="#111111" stroke-width="6" fill="none"/>
        <rect x="88" y="72" width="24" height="18" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <rect x="64" y="14" width="72" height="70" rx="22" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <rect x="78" y="44" width="16" height="13" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
        <rect x="106" y="44" width="16" height="13" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
        <path d="M79 36 h15 M106 36 h15" stroke="#111111" stroke-width="5" fill="none"/>
        <path d="M100 59 v6 h4" stroke="#111111" stroke-width="4" fill="none"/>
        <path d="M91 71 h18" stroke="#111111" stroke-width="4" fill="none"/>
        <path d="M64 38 C64 15 82 7 100 7 C118 7 136 15 136 38 C128 26 116 22 100 22 C84 22 72 26 64 38 Z" fill="#2A211C" stroke="#111111" stroke-width="5"/>
      </g>
      <g stroke="#111111" stroke-width="5" stroke-linejoin="round">
        <sc-if value="{{isBeanie}}" hint-placeholder-val="{{ true }}">
          <path d="M62 34 C62 10 80 2 100 2 C120 2 138 10 138 34 Z" fill="#FF5A3C"/>
          <rect x="58" y="31" width="84" height="15" rx="5" fill="#FF5A3C"/>
        </sc-if>
        <sc-if value="{{isBand}}" hint-placeholder-val="{{ true }}">
          <rect x="60" y="28" width="80" height="14" rx="3" fill="#FFC700"/>
          <path d="M140 34 L164 26 M140 39 L164 47" fill="none" stroke-linecap="round"/>
        </sc-if>
      </g>
    </svg>
  </div>

  <!-- слоты экипировки -->
  <div style="display: flex; gap: 6px; padding: 10px 16px 0;">
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
      <div class="chip" onClick="{{s.pick}}" style="flex-grow: 1; background: {{s.bg}}; padding: 8px 4px; text-align: center;">
        <div class="dsp" style="font-size: 11px; letter-spacing: 0.8px; color: {{s.fg}};">{{s.label}}</div>
      </div>
    </sc-for>
  </div>

  <!-- опыт -->
  <div style="padding: 12px 16px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px;">
      <span class="dsp" style="font-size: 11px; letter-spacing: 1.4px;">Опыт</span>
      <span class="dsp" style="font-size: 13px;">7 420 / 12 000</span>
    </div>
    <div style="height: 18px; border: 3px solid #111111; background: #FFFFFF; display: flex;">
      <div style="width: 62%; background: #FFC700;"></div>
    </div>
  </div>

  <!-- атрибуты -->
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 12px 16px 0;">
    <sc-for list="{{attrs}}" as="a" hint-placeholder-count="5">
      <div style="border: 3px solid #111111; background: {{a.bg}}; padding: 7px 2px 6px; text-align: center;">
        <div class="dsp" style="font-size: 24px; line-height: 1; color: {{a.fg}};">{{a.val}}</div>
        <div class="dsp" style="font-size: 9px; letter-spacing: 0.6px; margin-top: 2px; color: {{a.fg}};">{{a.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="font-size: 12px; padding: 9px 16px 0; line-height: 1.35; font-weight: 500;">
    Подвижность отстаёт на 6. Персонаж деревенеет.
  </div>

  <!-- действие -->
  <div style="padding: 10px 16px 0;">
    <div style="height: 54px; background: #111111; color: #F7F4EC; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>
      <span class="dsp" style="font-size: 16px; letter-spacing: 1.4px;">Начать тренировку</span>
    </div>
  </div>

  <!-- навигация -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px solid #111111; margin-top: auto;">
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #FFC700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.5-6 7-6s7 2 7 6"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Герой</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Лог</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-7-4-7 4z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Квесты</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 5-3 8-7 9-4-1-7-4-7-9V7z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Снаряга</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"stageColor":{"editor":"color","default":"#FFC700","options":["#FFC700","#FF5A3C","#3FBF5F","#F7F4EC"],"section":"Тема"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { belt: 'white', head: 'none' };
  }

  renderVals() {
    const BELTS = {
      white:  { color: '#FFFFFF', name: 'Белый' },
      blue:   { color: '#2F6BFF', name: 'Синий' },
      purple: { color: '#B569FF', name: 'Пурпур' },
      black:  { color: '#111111', name: 'Чёрный' },
    };
    const belt = BELTS[this.state.belt] || BELTS.white;

    const slotDefs = [
      { id: 'white',  label: 'Белый',   kind: 'belt' },
      { id: 'blue',   label: 'Синий',   kind: 'belt' },
      { id: 'beanie', label: 'Шапка',   kind: 'head' },
      { id: 'band',   label: 'Хатимаки', kind: 'head' },
    ];

    const slots = slotDefs.map((s) => {
      const on = s.kind === 'belt' ? this.state.belt === s.id : this.state.head === s.id;
      return {
        label: s.label,
        bg: on ? '#111111' : '#FFFFFF',
        fg: on ? '#F7F4EC' : '#111111',
        pick: () => {
          if (s.kind === 'belt') this.setState({ belt: s.id });
          else this.setState({ head: this.state.head === s.id ? 'none' : s.id });
        },
      };
    });

    const attrs = [
      { name: 'Сила',   val: 12, bg: '#FFFFFF', fg: '#111111' },
      { name: 'Вынос',  val: 15, bg: '#FFFFFF', fg: '#111111' },
      { name: 'Подвиж', val: 6,  bg: '#FF5A3C', fg: '#111111' },
      { name: 'Стойк',  val: 9,  bg: '#FFFFFF', fg: '#111111' },
      { name: 'Воля',   val: 11, bg: '#FFFFFF', fg: '#111111' },
    ];

    return {
      stageColor: this.props.stageColor ?? '#FFC700',
      beltColor: belt.color,
      beltName: belt.name,
      isBeanie: this.state.head === 'beanie',
      isBand: this.state.head === 'band',
      slots,
      attrs,
    };
  }
}
</script>
</body>
</html>
