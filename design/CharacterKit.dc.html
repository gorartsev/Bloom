<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ui" style="width: 940px; height: 720px; background: #F7F4EC; color: #111111; padding: 22px; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 14px;">
    <div class="dsp" style="font-size: 60px; line-height: 0.82; letter-spacing: -1.5px;">Гардероб</div>
    <div style="max-width: 420px; font-size: 12px; font-weight: 500; line-height: 1.45; text-align: right;">
      Каждая вещь это форма, нарисованная кодом, а не картинка. Поэтому цвет любой, комбинация любая,
      и ничего не разъезжается. Генерацией делаются только принты на груди: это плоские картинки,
      и в них генератор как раз хорош.
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; flex-grow: 1; min-height: 0;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="18">
      <div style="border: 3px solid #111111; background: {{it.stage}}; display: flex; flex-direction: column; overflow: hidden;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 6px;">
          <svg viewBox="0 0 100 100" style="width: 100%; height: 100%;">
            <g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
              <path d="{{it.d}}" fill="{{it.fill}}"/>
              <path d="{{it.d2}}" fill="{{it.fill2}}"/>
              <path d="{{it.mark}}" fill="none" stroke="{{it.markInk}}" stroke-width="4"/>
            </g>
          </svg>
        </div>
        <div style="border-top: 3px solid #111111; background: #FFFFFF; padding: 5px 7px 6px;">
          <div class="dsp" style="font-size: 12px; line-height: 1.05;">{{it.name}}</div>
          <div style="font-size: 9px; font-weight: 500; color: #6B6459; line-height: 1.2; margin-top: 1px;">{{it.slot}}</div>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

</script>
</body>
</html>
