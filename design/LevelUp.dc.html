<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #FFC700; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="text-align: center; padding: 22px 16px 0;">
    <span class="dsp" style="font-size: 13px; letter-spacing: 3px;">Уровень взят</span>
  </div>

  <div class="dsp" style="font-size: 150px; line-height: 0.76; text-align: center; letter-spacing: -6px; padding: 6px 0 0;">05</div>

  <!-- персонаж на чёрной плашке -->
  <div style="margin: 10px 16px 0; border: 3px solid #111111; background: #111111; height: 232px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative;">
    <div class="dsp" style="position: absolute; inset: 0; font-size: 40px; line-height: 1; color: #FFC700; opacity: 0.13; letter-spacing: 2px; padding: 6px;">Гора Гора Гора Гора Гора Гора Гора Гора Гора Гора</div>
    <svg width="196" height="226" viewBox="0 0 200 230" style="display: block; position: relative;">
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M80 170 L75 204 M120 170 L125 204" stroke="#111111" stroke-width="28" fill="none"/>
        <path d="M80 170 L75 204 M120 170 L125 204" stroke="#F3EEE0" stroke-width="20" fill="none"/>
        <rect x="48" y="198" width="48" height="24" rx="6" fill="#FF5A3C" stroke="#111111" stroke-width="5"/>
        <rect x="104" y="198" width="48" height="24" rx="6" fill="#FF5A3C" stroke="#111111" stroke-width="5"/>
        <path d="M56 206 h30 M56 213 h30 M114 206 h30 M114 213 h30" stroke="#111111" stroke-width="3" fill="none"/>
        <path d="M68 108 L46 154 M132 108 L154 154" stroke="#111111" stroke-width="28" fill="none"/>
        <path d="M68 108 L46 154 M132 108 L154 154" stroke="#F3EEE0" stroke-width="20" fill="none"/>
        <circle cx="44" cy="159" r="12" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <circle cx="156" cy="159" r="12" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <path d="M100 88 L66 100 L62 176 H138 L134 100 Z" fill="#F3EEE0" stroke="#111111" stroke-width="5"/>
        <path d="M100 88 L84 136 M100 88 L116 136" stroke="#111111" stroke-width="5" fill="none"/>
        <path d="M70 102 l5 -9 l5 9 z M120 102 l5 -9 l5 9 z" fill="#111111" stroke="#111111" stroke-width="3"/>
        <rect x="60" y="140" width="80" height="18" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
        <path d="M94 158 v20 M108 158 v15" stroke="#111111" stroke-width="6" fill="none"/>
        <rect x="88" y="76" width="24" height="18" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <rect x="64" y="18" width="72" height="70" rx="22" fill="#F2C89C" stroke="#111111" stroke-width="5"/>
        <rect x="78" y="48" width="16" height="13" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
        <rect x="106" y="48" width="16" height="13" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
        <path d="M79 40 h15 M106 40 h15" stroke="#111111" stroke-width="5" fill="none"/>
        <path d="M100 63 v6 h4" stroke="#111111" stroke-width="4" fill="none"/>
        <path d="M91 75 h18" stroke="#111111" stroke-width="4" fill="none"/>
        <circle cx="66" cy="66" r="5" fill="none" stroke="#111111" stroke-width="4"/>
        <path d="M64 30 C64 20 70 16 78 18 L86 4 L96 20 L106 2 L114 20 L122 6 L130 22 C136 20 138 26 136 32 C126 24 112 20 100 20 C86 20 74 24 64 30 Z" fill="#FF5A3C" stroke="#111111" stroke-width="5"/>
      </g>
      <g stroke="#111111" stroke-width="4" stroke-linejoin="round">
        <path d="M22 118 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#FFC700"/>
        <path d="M178 138 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#FFC700"/>
        <path d="M164 26 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#FFC700"/>
      </g>
    </svg>
  </div>

  <!-- что выросло -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 10px 16px 0;">
    <div style="border: 3px solid #111111; background: #F7F4EC; padding: 8px 10px;">
      <div class="dsp" style="font-size: 10px; letter-spacing: 1.2px; color: #6B6459;">Выносливость</div>
      <div class="dsp" style="font-size: 20px; line-height: 1.1;">15 → 16</div>
    </div>
    <div style="border: 3px solid #111111; background: #F7F4EC; padding: 8px 10px;">
      <div class="dsp" style="font-size: 10px; letter-spacing: 1.2px; color: #6B6459;">Стойкость</div>
      <div class="dsp" style="font-size: 20px; line-height: 1.1;">9 → 11</div>
    </div>
  </div>

  <div style="margin: 6px 16px 0; border: 3px solid #111111; background: #FF5A3C; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
    <div>
      <div class="dsp" style="font-size: 10px; letter-spacing: 1.2px;">Открылось</div>
      <div class="dsp" style="font-size: 17px; line-height: 1.1;">Хатимаки</div>
    </div>
    <div style="font-size: 10px; font-weight: 600; text-align: right; line-height: 1.3;">30 сессий<br>изометрии шеи</div>
  </div>

  <!-- фокус следующей недели -->
  <div style="padding: 12px 16px 0;">
    <div class="dsp" style="font-size: 11px; letter-spacing: 1.6px; margin-bottom: 7px;">Фокус следующей недели</div>
    <div style="display: flex; gap: 6px;">
      <sc-for list="{{focus}}" as="f" hint-placeholder-count="3">
        <div onClick="{{f.pick}}" style="flex-grow: 1; border: 3px solid #111111; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer; padding: 13px 5px; text-align: center;">
          <div class="dsp" style="font-size: 13px; line-height: 1.05;">{{f.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 11px; font-weight: 500; margin-top: 7px; line-height: 1.35;">{{focusNote}}</div>
  </div>

  <div style="padding: 12px 16px 20px; margin-top: auto;">
    <div style="height: 56px; background: #111111; color: #FFC700; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <span class="dsp" style="font-size: 16px; letter-spacing: 1.6px;">Забрать и продолжить</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 'mob' };
  }

  renderVals() {
    const defs = [
      { id: 'str', label: 'Сила', note: 'Тренер добавит подход на базовых и снизит объём вспомогательных. Мат от этого просядет на неделю.' },
      { id: 'mob', label: 'Подвижность', note: 'Твоё слабое место: разрыв в 9 пунктов. Тренер поставит мобильность в каждый день бега и добавит блок после мата.' },
      { id: 'rec', label: 'Разгрузка', note: 'Объём минус сорок процентов. Берётся, когда усталость лезет выше 1.3 или мат стал тяжелее обычного.' },
    ];

    const sel = defs.find((d) => d.id === this.state.focus) || defs[1];

    return {
      focus: defs.map((d) => ({
        label: d.label,
        bg: d.id === this.state.focus ? '#111111' : '#F7F4EC',
        fg: d.id === this.state.focus ? '#FFC700' : '#111111',
        pick: () => this.setState({ focus: d.id }),
      })),
      focusNote: sel.note,
    };
  }
}
</script>
</body>
</html>
