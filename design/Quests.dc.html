<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF4D26; } a:hover { color: #16151A; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; font-weight: 700; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F5F2EA; color: #16151A; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 24px 0;">
    <div class="lbl" style="color: #8A8579;">Блок 1 · неделя 3 из 8</div>
    <div class="dsp" style="font-size: 40px; line-height: 0.95; margin-top: 10px;">Что закрываем<br>в этом блоке</div>
    <div style="font-size: 14px; color: #8A8579; margin-top: 10px; line-height: 1.45;">
      Не выдуманные цели. Это условия, при которых тренер откроет следующий блок.
    </div>
  </div>

  <div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 24px;">
    <sc-for list="{{quests}}" as="q" hint-placeholder-count="4">
      <div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <span class="dsp" style="font-size: 19px; line-height: 1.1; color: {{q.nameColor}};">{{q.name}}</span>
          <span class="num" style="font-size: 14px; font-weight: 600; white-space: nowrap; color: {{q.countColor}};">{{q.count}}</span>
        </div>
        <div style="height: 6px; background: #E2DED2; margin-top: 10px;">
          <div style="width: {{q.pct}}; height: 6px; background: {{q.color}};"></div>
        </div>
        <div style="font-size: 13px; color: #8A8579; margin-top: 8px; line-height: 1.4;">{{q.hint}}</div>
      </div>
    </sc-for>
  </div>

  <!-- босс: единственное цветное поле на экране -->
  <div style="margin-top: auto; background: #16151A; color: #F5F2EA; padding: 22px 24px;">
    <div class="lbl" style="color: #FF4D26;">В конце блока</div>
    <div class="dsp" style="font-size: 26px; line-height: 1.05; margin-top: 6px;">Тест силы</div>
    <div style="font-size: 13px; margin-top: 8px; line-height: 1.45; opacity: 0.7;">
      Через пять недель. Откроется, когда закроешь три квеста из четырёх. Сейчас закрыт один.
    </div>
  </div>

  <div style="border-top: 1px solid #2C2A31; background: #16151A; display: flex;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div style="flex-grow: 1; text-align: center; padding: 16px 0 22px;">
        <span class="lbl" style="color: {{n.color}};">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      { name: 'Подтягивания 3 × 8', count: 'закрыт', pct: '100%', color: '#2E7D4F', done: true,
        hint: 'Три подхода с запасом в два повтора, локти чистые.' },
      { name: 'Румынская 80 кг', count: '65 из 80', pct: '81%', color: '#FF4D26',
        hint: 'Три подхода по шесть. Прибавляем по 2.5 кг за сессию.' },
      { name: 'Шея два месяца', count: '3 из 8 нед', pct: '38%', color: '#2F5FD0',
        hint: 'Изометрия без пропусков. После этого откроется мост.' },
      { name: 'Восемь недель ровно', count: '3 из 8 нед', pct: '38%', color: '#C99A2E',
        hint: 'Без пропуска больше одной силовой подряд.' },
    ];
    return {
      quests: defs.map((d) => ({
        ...d,
        nameColor: d.done ? '#8A8579' : '#16151A',
        countColor: d.done ? '#2E7D4F' : '#8A8579',
      })),
      nav: [
        { name: 'Сегодня', color: '#7C7869' },
        { name: 'Герой', color: '#7C7869' },
        { name: 'Прогресс', color: '#F5F2EA' },
        { name: 'Профиль', color: '#7C7869' },
      ],
    };
  }
}
</script>
</body>
</html>
