<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Archivo:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF3D00; } a:hover { color: #0D0D0D; }
    .dsp { font-family: Unbounded, Impact, sans-serif; font-weight: 900; letter-spacing: -0.03em; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
    @keyframes grow { from { width: 0; } to { width: var(--w); } }
    .bar { animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #B6FF3D; color: #0D0D0D; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 0;">
    <span class="lbl">Блок 1 · неделя 3 из 8</span>
    <div class="dsp" style="font-size: 44px; line-height: 0.88; margin-top: 12px;">ЧТО<br>ЗАКРЫВАЕМ</div>
    <div style="font-size: 13px; font-weight: 600; margin-top: 10px; line-height: 1.4;">
      Не выдуманные цели. Это условия, при которых тренер откроет следующий блок.
    </div>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column;">
    <sc-for list="{{quests}}" as="q" hint-placeholder-count="4">
      <div style="background: {{q.bg}}; color: {{q.fg}}; padding: 14px 20px 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <span class="dsp" style="font-size: 17px; line-height: 1.05;">{{q.name}}</span>
          <span class="dsp num" style="font-size: 14px; white-space: nowrap; color: {{q.countFg}};">{{q.count}}</span>
        </div>
        <div style="height: 8px; background: {{q.track}}; margin-top: 10px;">
          <div class="bar" style="--w: {{q.pct}}; width: {{q.pct}}; height: 8px; background: {{q.fill}};"></div>
        </div>
        <div style="font-size: 12px; font-weight: 600; margin-top: 8px; opacity: 0.75; line-height: 1.35;">{{q.hint}}</div>
      </div>
    </sc-for>
  </div>

  <!-- босс: оранжевый блок -->
  <div style="background: #FF3D00; color: #FFFFFF; margin-top: auto; padding: 20px;">
    <span class="lbl" style="color: #FFE500;">В конце блока</span>
    <div class="dsp" style="font-size: 30px; line-height: 1; margin-top: 8px;">ТЕСТ СИЛЫ</div>
    <div style="font-size: 13px; font-weight: 600; margin-top: 8px; line-height: 1.4; opacity: 0.85;">
      Через пять недель. Откроется, когда закроешь три квеста из четырёх. Сейчас закрыт один.
    </div>
  </div>

  <div style="background: #0D0D0D; display: flex;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div style="flex-grow: 1; text-align: center; padding: 15px 0 22px; background: {{n.bg}};">
        <span class="lbl" style="color: {{n.fg}};">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      { name: 'ПОДТЯГИВАНИЯ 3 × 8', count: 'закрыт', pct: '100%', bg: '#0D0D0D', fg: '#FFFFFF',
        track: '#2A2A2A', fill: '#B6FF3D', countFg: '#B6FF3D',
        hint: 'Три подхода с запасом в два повтора, локти чистые.' },
      { name: 'РУМЫНСКАЯ 80 КГ', count: '65 / 80', pct: '81%', bg: '#FFE500', fg: '#0D0D0D',
        track: '#D9C400', fill: '#FF3D00', countFg: '#0D0D0D',
        hint: 'Три подхода по шесть. Прибавляем по 2.5 кг за сессию.' },
      { name: 'ШЕЯ ДВА МЕСЯЦА', count: '3 / 8 нед', pct: '38%', bg: '#2B4CFF', fg: '#FFFFFF',
        track: '#1832B8', fill: '#FFE500', countFg: '#B6FF3D',
        hint: 'Изометрия без пропусков. После этого откроется мост.' },
      { name: 'ВОСЕМЬ НЕДЕЛЬ РОВНО', count: '3 / 8 нед', pct: '38%', bg: '#FF4FA3', fg: '#0D0D0D',
        track: '#D93B85', fill: '#0D0D0D', countFg: '#0D0D0D',
        hint: 'Без пропуска больше одной силовой подряд.' },
    ];
    return {
      quests: defs,
      nav: [
        { name: 'Сегодня', bg: '#0D0D0D', fg: '#7A7A7A' },
        { name: 'Герой',   bg: '#0D0D0D', fg: '#7A7A7A' },
        { name: 'Прогресс',bg: '#B6FF3D', fg: '#0D0D0D' },
        { name: 'Профиль', bg: '#0D0D0D', fg: '#7A7A7A' },
      ],
    };
  }
}
</script>
</body>
</html>
