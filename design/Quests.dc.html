<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF5A3C; } a:hover { color: #111111; }
    .dsp { font-family: Oswald, Haettenschweiler, Impact, sans-serif; text-transform: uppercase; font-weight: 700; }
    .ui  { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #F7F4EC; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span class="dsp" style="font-size: 13px; letter-spacing: 1.6px;">Блок 1 · нед. 3 из 8</span>
  </div>

  <div class="dsp" style="font-size: 58px; line-height: 0.84; letter-spacing: -1px; padding: 0 16px 4px;">Квесты</div>
  <div style="font-size: 12px; font-weight: 500; padding: 0 16px 12px; color: #6B6459;">Цели не выдуманы. Это условия выхода из блока.</div>

  <!-- переключатель -->
  <div style="display: flex; gap: 6px; padding: 0 16px 12px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <div onClick="{{t.pick}}" style="border: 3px solid #111111; background: {{t.bg}}; color: {{t.fg}}; cursor: pointer; padding: 8px 14px;">
        <span class="dsp" style="font-size: 12px; letter-spacing: 1.2px;">{{t.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{quests}}" as="q" hint-placeholder-count="4">
      <div style="border: 3px solid #111111; background: {{q.bg}}; padding: 11px 12px;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
          <div style="flex-grow: 1;">
            <div class="dsp" style="font-size: 16px; line-height: 1.05; color: {{q.fg}};">{{q.name}}</div>
            <div style="font-size: 11px; font-weight: 500; margin-top: 3px; color: {{q.subFg}};">{{q.hint}}</div>
          </div>
          <div style="border: 3px solid #111111; background: {{q.xpBg}}; padding: 3px 7px; white-space: nowrap;">
            <span class="dsp" style="font-size: 12px; color: {{q.xpFg}};">{{q.xp}}</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 9px;">
          <div style="flex-grow: 1; height: 13px; border: 3px solid #111111; background: #FFFFFF; display: flex;">
            <div style="width: {{q.pct}}; background: {{q.barColor}};"></div>
          </div>
          <span class="dsp" style="font-size: 12px; color: {{q.fg}};">{{q.count}}</span>
        </div>
      </div>
    </sc-for>

    <!-- босс -->
    <div style="border: 3px solid #111111; background: #111111; color: #F7F4EC; padding: 12px; margin-top: auto; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div class="dsp" style="font-size: 11px; letter-spacing: 1.6px; color: #FF5A3C;">Босс блока</div>
          <div class="dsp" style="font-size: 24px; line-height: 1.05; margin-top: 2px;">Тест силы</div>
          <div style="font-size: 11px; font-weight: 500; margin-top: 3px; color: #C9C3B6;">Через 5 недель. Открывается, когда закрыты три квеста из четырёх.</div>
        </div>
        <div style="border: 3px solid #FF5A3C; padding: 8px 10px; text-align: center;">
          <div class="dsp" style="font-size: 22px; line-height: 1; color: #FF5A3C;">2</div>
          <div class="dsp" style="font-size: 9px; letter-spacing: 0.8px; color: #FF5A3C;">из 4</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px solid #111111;">
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.5-6 7-6s7 2 7 6"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Герой</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Лог</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #FFC700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-7-4-7 4z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Квесты</span>
    </div>
    <div style="padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 5-3 8-7 9-4-1-7-4-7-9V7z"/></svg>
      <span class="dsp" style="font-size: 10px; letter-spacing: 0.8px;">Снаряга</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'block' };
  }

  renderVals() {
    const SETS = {
      block: [
        { name: 'Подтягивания 3×8', hint: 'С запасом RIR 2, без боли в локтях', count: '6/8', pct: '75%', xp: '+800', color: '#FFC700' },
        { name: 'Румынская 80 кг', hint: 'Три подхода по шесть', count: '65/80', pct: '81%', xp: '+800', color: '#FF5A3C' },
        { name: 'Шея два месяца', hint: 'Изометрия без пропусков, потом откроется мост', count: '3/8 нед', pct: '38%', xp: '+600', color: '#2F6BFF' },
        { name: 'Восемь недель ровно', hint: 'Без пропуска больше одной силовой подряд', count: '3/8 нед', pct: '38%', xp: '+1000', color: '#3FBF5F' },
      ],
      week: [
        { name: 'Две силовые', hint: 'Вторник и четверг, прицепом к мату', count: '1/2', pct: '50%', xp: '+250', color: '#FF5A3C' },
        { name: 'Три пробежки', hint: 'Понедельник, среда, пятница', count: '2/3', pct: '67%', xp: '+200', color: '#3FBF5F' },
        { name: 'Мобильность ×3', hint: 'Десять минут в дни бега, не больше', count: '1/3', pct: '33%', xp: '+150', color: '#B569FF' },
        { name: 'Не выпасть из коридора', hint: 'Усталость держится ниже 1.3 всю неделю', count: '1.15', pct: '88%', xp: '+300', color: '#FFC700' },
      ],
    };

    const list = SETS[this.state.tab] || SETS.block;

    const quests = list.map((q, i) => {
      const lead = i === 0;
      return {
        name: q.name,
        hint: q.hint,
        count: q.count,
        pct: q.pct,
        xp: q.xp,
        barColor: q.color,
        bg: lead ? '#111111' : '#FFFFFF',
        fg: lead ? '#F7F4EC' : '#111111',
        subFg: lead ? '#C9C3B6' : '#6B6459',
        xpBg: lead ? q.color : '#FFFFFF',
        xpFg: '#111111',
      };
    });

    const tabs = [
      { id: 'block', label: 'Блок' },
      { id: 'week', label: 'Эта неделя' },
    ].map((t) => ({
      label: t.label,
      bg: this.state.tab === t.id ? '#111111' : '#FFFFFF',
      fg: this.state.tab === t.id ? '#F7F4EC' : '#111111',
      pick: () => this.setState({ tab: t.id }),
    }));

    return { quests, tabs };
  }
}
</script>
</body>
</html>
