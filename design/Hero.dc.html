<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #635BDF; } a:hover { color: #252323; }
    .dsp { font-family: Unbounded, Impact, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
    .tap { transition: transform 130ms cubic-bezier(.2,.8,.2,1), background-color 130ms ease; cursor: pointer; }
    @keyframes grow { from { width: 0; } to { width: var(--w); } }
    .bar { animation: grow 800ms cubic-bezier(.2,.8,.2,1) both; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    .lay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #FFFFFF; color: #252323; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0;">
    <div>
      <div class="lbl" style="color: #6E6A68;">Уровень 4 · блок 1</div>
      <div class="dsp" style="font-size: 30px; line-height: 1; margin-top: 6px;">Гора</div>
    </div>
    <div style="background: #8EFF8E; border-radius: 999px; padding: 9px 15px;">
      <span class="lbl">Свеж</span>
    </div>
  </div>

  <!-- сцена: мятный круг, персонаж парит -->
  <div style="position: relative; height: 322px; margin-top: 6px; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; width: 292px; height: 292px; border-radius: 146px; background: #E4E2F5;"></div>
    <div class="bob" style="position: relative; width: 168px; height: 252px;">
      <sc-for list="{{worn}}" as="w" hint-placeholder-count="2">
        <img class="lay" src="{{w.src}}">
      </sc-for>
    </div>
    <div style="position: absolute; right: 22px; bottom: 8px; background: #635BDF; color: #FFFFFF; border-radius: 999px; padding: 9px 15px; transform: rotate(-4deg);">
      <span class="lbl">Белый пояс</span>
    </div>
  </div>

  <!-- слоты образа: интерактив -->
  <div style="padding: 6px 20px 0;">
    <div style="display: flex; gap: 6px;">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <div class="tap" onClick="{{s.pick}}" style="flex-grow: 1; background: {{s.bg}}; color: {{s.fg}}; border-radius: 18px; padding: 9px 8px 10px; text-align: center;">
          <div class="lbl" style="color: {{s.subFg}};">{{s.slot}}</div>
          <div class="dsp" style="font-size: 13px; margin-top: 3px;">{{s.name}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- опыт -->
  <div style="padding: 18px 20px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span class="lbl" style="color: #6E6A68;">До пятого уровня</span>
      <span class="num dsp" style="font-size: 13px;">7 420 / 12 000</span>
    </div>
    <div style="height: 12px; background: #F4F4F8; border-radius: 6px; margin-top: 8px; overflow: hidden;">
      <div class="bar" style="--w: 62%; width: 62%; height: 12px; border-radius: 6px; background: #635BDF;"></div>
    </div>
  </div>

  <!-- атрибуты -->
  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{attrs}}" as="a" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 13px; font-weight: 600; width: 92px;">{{a.name}}</span>
        <div style="flex-grow: 1; height: 8px; background: #F4F4F8; border-radius: 4px; overflow: hidden;">
          <div class="bar" style="--w: {{a.pct}}; width: {{a.pct}}; height: 8px; border-radius: 4px; background: {{a.color}};"></div>
        </div>
        <span class="dsp num" style="font-size: 15px; width: 22px; text-align: right;">{{a.val}}</span>
      </div>
    </sc-for>
  </div>

  <div class="tap" style="margin: auto 16px 0; background: #F4F4F8; border-radius: 22px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div class="dsp" style="font-size: 16px;">Гардероб</div>
      <div class="lbl" style="color: #6E6A68; margin-top: 3px;">14 вещей · 3 новых</div>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 18px; background: #8EFF8E; display: flex; align-items: center; justify-content: center;">
      <span class="dsp" style="font-size: 16px;">→</span>
    </div>
  </div>

  <div style="display: flex; padding: 14px 16px 22px; gap: 6px;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div class="tap" style="flex-grow: 1; text-align: center; padding: 16px 0; border-radius: 999px; background: {{n.bg}};">
        <span class="lbl" style="color: {{n.fg}};">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pants: 0, outfit: 1, hair: 1 };
  }

  renderVals() {
    // три слота под то, что реально нарисовано: одежда пришла цельными
    // образами вместе с телом, поэтому верх и низ отдельно не переключить
    const SETS = {
      pants:  [['leopard', 'Леопард'], ['mint', 'Мятные'], ['hearts', 'Сердечки'], ['black', 'Чёрные']],
      outfit: [['none', 'Без одежды'], ['bandtee', 'Бэнд-ти'], ['hoodie', 'Худи'], ['rash', 'Рашгард']],
      hair:   [['bald', 'Лысый'], ['curly', 'Кудри'], ['mohawk', 'Ирокез'], ['braids', 'Брейды']],
    };
    const slot = (key, label) => ({
      slot: label,
      name: SETS[key][this.state[key]][1],
      bg: this.state[key] === 0 ? '#F4F4F8' : '#9F9FED',
      fg: '#252323',
      subFg: this.state[key] === 0 ? '#6E6A68' : '#332F63',
      pick: () => this.setState({ [key]: (this.state[key] + 1) % SETS[key].length }),
    });
    const pick = (k) => SETS[k][this.state[k]][0];
    const worn = [];
    worn.push({ src: pick('outfit') === 'none' ? `l-${pick('pants')}.png` : `l-${pick('outfit')}.png` });
    if (pick('hair') !== 'bald') worn.push({ src: `l-${pick('hair')}.png` });

    return {
      worn,
      slots: [slot('pants', 'Трусы'), slot('outfit', 'Образ'), slot('hair', 'Причёска')],
      attrs: [
        { name: 'Сила', val: 12, pct: '60%', color: '#8EFF8E' },
        { name: 'Выносливость', val: 15, pct: '75%', color: '#635BDF' },
        { name: 'Подвижность', val: 6, pct: '30%', color: '#9F9FED' },
        { name: 'Стойкость', val: 9, pct: '45%', color: '#252323' },
        { name: 'Воля', val: 11, pct: '55%', color: '#8EFF8E' },
      ],
      nav: [
        { name: 'Сегодня', bg: '#F4F4F8', fg: '#6E6A68' },
        { name: 'Герой', bg: '#8EFF8E', fg: '#252323' },
        { name: 'Прогресс', bg: '#F4F4F8', fg: '#6E6A68' },
        { name: 'Я', bg: '#F4F4F8', fg: '#6E6A68' },
      ],
    };
  }
}
</script>
</body>
</html>
