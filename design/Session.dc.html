<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #635BDF; } a:hover { color: #252323; }
    .dsp { font-family: Unbounded, Impact, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
    .ui  { font-family: Archivo, system-ui, sans-serif; }
    .lbl { font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .num { font-variant-numeric: tabular-nums; }
    .tap { transition: transform 130ms cubic-bezier(.2,.8,.2,1), background-color 130ms ease; cursor: pointer; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .drop { animation: drop 300ms cubic-bezier(.2,.9,.3,1) both; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #FFFFFF; color: #252323; display: flex; flex-direction: column; overflow: hidden;">

  <!-- прогресс сессии полосками: интерактивный шаг -->
  <div style="padding: 2px 20px 0;">
    <div style="display: flex; gap: 5px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div class="tap" onClick="{{s.go}}" style="flex-grow: 1; padding: 19px 0; display: flex; align-items: center;">
          <div style="width: 100%; height: 6px; border-radius: 3px; background: {{s.bg}};"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 0;">
      <span class="lbl" style="color: #6E6A68;">Упражнение 2 из 4 · 34 мин</span>
      <span class="lbl" style="color: #635BDF;">Завершить</span>
    </div>
  </div>

  <!-- тап по названию открывает меню упражнения: заменить, посмотреть технику, историю -->
  <div class="tap" style="padding: 8px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <div class="dsp" style="font-size: 30px; line-height: 1;">Жим гантелей</div>
      <span class="dsp" style="font-size: 20px; color: #6E6A68;">›</span>
    </div>
    <div style="font-size: 13px; color: #6E6A68; margin-top: 8px;">Цель 3 × 8 · прошлый раз 22 × 8, запас 2</div>
  </div>

  <!-- записанные подходы: мятные пилюли, растут слева направо -->
  <div style="display: flex; gap: 7px; padding: 12px 20px 0; flex-wrap: wrap;">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
      <div class="drop" style="background: {{s.bg}}; color: {{s.fg}}; border-radius: 999px; padding: 9px 15px; border: 2px dashed {{s.border}};">
        <span class="num dsp" style="font-size: 14px;">{{s.txt}}</span>
      </div>
    </sc-for>
  </div>

  <!-- ввод: белый, крупные круглые кнопки -->
  <div style="background: #F4F4F8; border-radius: 28px; margin: 12px 16px 0; padding: 16px 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="tap" onClick="{{decW}}" style="width: 54px; height: 54px; border-radius: 27px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <div style="width: 18px; height: 3px; border-radius: 2px; background: #252323;"></div>
      </div>
      <!-- само число это поле: тап открывает нампад, крутить плюсиками до 67.5 долго -->
      <div class="tap" style="flex-grow: 1; background: #FFFFFF; border: 2px solid #E4E4EE; border-radius: 20px; padding: 6px 0 8px; text-align: center;">
        <div class="dsp num" style="font-size: 44px; line-height: 1;">{{w}}</div>
        <div class="lbl" style="color: #6E6A68;">кг · вписать</div>
      </div>
      <div class="tap" onClick="{{incW}}" style="width: 54px; height: 54px; border-radius: 27px; background: #8EFF8E; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;">
        <div style="width: 18px; height: 3px; border-radius: 2px; background: #252323;"></div>
        <div style="width: 3px; height: 18px; border-radius: 2px; background: #252323; position: absolute;"></div>
      </div>
    </div>

    <div style="height: 1px; background: #E4E4EE; margin: 14px 0;"></div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="tap" onClick="{{decR}}" style="width: 54px; height: 54px; border-radius: 27px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <div style="width: 18px; height: 3px; border-radius: 2px; background: #252323;"></div>
      </div>
      <div class="tap" style="flex-grow: 1; background: #FFFFFF; border: 2px solid #E4E4EE; border-radius: 20px; padding: 6px 0 8px; text-align: center;">
        <div class="dsp num" style="font-size: 44px; line-height: 1;">{{r}}</div>
        <div class="lbl" style="color: #6E6A68;">повторов · вписать</div>
      </div>
      <div class="tap" onClick="{{incR}}" style="width: 54px; height: 54px; border-radius: 27px; background: #8EFF8E; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;">
        <div style="width: 18px; height: 3px; border-radius: 2px; background: #252323;"></div>
        <div style="width: 3px; height: 18px; border-radius: 2px; background: #252323; position: absolute;"></div>
      </div>
    </div>
  </div>

  <!-- RIR: шкала-ползунок, а не пять кнопок -->
  <div style="padding: 14px 20px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span class="lbl" style="color: #6E6A68;">Запас</span>
      <span style="font-size: 13px; font-weight: 600; color: #635BDF;">{{rirWord}}</span>
    </div>
    <div style="display: flex; gap: 4px; margin-top: 12px;">
      <sc-for list="{{rirs}}" as="x" hint-placeholder-count="5">
        <div class="tap" onClick="{{x.pick}}" style="flex-grow: 1; height: {{x.h}}; border-radius: 12px; background: {{x.bg}}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;">
          <span class="dsp num" style="font-size: 15px; color: {{x.fg}};">{{x.v}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- тренер: говорит только числом, которого нет у тебя. Иначе молчит -->
  <div style="margin: 12px 16px 0; background: #8EFF8E; border-radius: 22px 22px 22px 8px; padding: 12px 14px; display: flex; gap: 12px;">
    <div class="bob" style="width: 44px; height: 54px; border-radius: 12px; border: 2px dashed #3F8F3F; background: rgba(255,255,255,0.55); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
      <span class="lbl" style="font-size: 8px; letter-spacing: 0.4px; color: #2C4A2C;">перс</span>
    </div>
    <div style="flex-grow: 1;">
      <div class="lbl" style="color: #2C4A2C;">Тренер</div>
      <div style="font-size: 14px; font-weight: 600; margin-top: 4px; line-height: 1.35;">{{coachLine}}</div>
      <div style="display: flex; gap: 6px; margin-top: 10px;">
        <sc-for list="{{coachActs}}" as="a" hint-placeholder-count="2">
          <div class="tap" style="background: {{a.bg}}; color: {{a.fg}}; border-radius: 999px; padding: 13px 14px;">
            <span style="font-size: 13px; font-weight: 700;">{{a.name}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="tap" onClick="{{save}}" style="background: #252323; color: #8EFF8E; border-radius: 999px; height: 66px; flex-shrink: 0; margin: auto 16px 0; display: flex; align-items: center; justify-content: center;">
    <span class="dsp" style="font-size: 19px;">Записать подход</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; margin: 10px 16px 18px; background: #9F9FED; color: #252323; border-radius: 20px; padding: 14px 20px;">
    <span class="lbl">Отдых</span>
    <span class="dsp num" style="font-size: 19px;">1:30</span>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { w: 22, r: 8, rir: 2, step: 1 };
  }

  renderVals() {
    const bump = (k, d, min) => () => this.setState({ [k]: Math.max(min, this.state[k] + d) });
    const WORDS = ['до отказа', 'остался один', 'осталось два', 'осталось три', 'запас большой'];
    return {
      w: this.state.w,
      r: this.state.r,
      incW: bump('w', 2, 0),
      decW: bump('w', -2, 0),
      incR: bump('r', 1, 1),
      decR: bump('r', -1, 1),
      rirWord: WORDS[this.state.rir],
      // реплика собрана из истории подходов, а не из общих слов
      coachLine: 'Прошлый раз 22 × 8 с запасом 2. Верх диапазона взят дважды. Ставь 24.',
      coachActs: [
        { name: 'Поставить 24', bg: '#252323', fg: '#8EFF8E' },
        { name: 'Оставить 22', bg: '#FFFFFF', fg: '#252323' },
      ],
      steps: [0, 1, 2, 3].map((i) => ({
        bg: i < this.state.step ? '#8EFF8E' : (i === this.state.step ? '#252323' : '#E4E4EE'),
        go: () => this.setState({ step: i }),
      })),
      sets: [
        { txt: '22 × 8', bg: '#8EFF8E', fg: '#252323', border: 'transparent' },
        { txt: '22 × 8', bg: '#8EFF8E', fg: '#252323', border: 'transparent' },
        { txt: 'подход 3', bg: '#FFFFFF', fg: '#6E6A68', border: '#D6D6E0' },
      ],
      rirs: [0, 1, 2, 3, 4].map((v) => ({
        v: v === 4 ? '4+' : v,
        h: [44, 48, 52, 57, 62][v] + 'px',
        bg: v === this.state.rir ? '#635BDF' : '#F4F4F8',
        fg: v === this.state.rir ? '#FFFFFF' : '#6E6A68',
        pick: () => this.setState({ rir: v }),
      })),
      save: () => this.setState({ r: this.state.r }),
    };
  }
}
</script>
</body>
</html>
