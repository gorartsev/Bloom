<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BLOOM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLOOM">
<meta name="theme-color" content="#0D0F14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">

<style>
:root{
  --bg:#0D0F14; --card:#161A22; --cardDim:#1E2430; --text:#EDF0F5;
  --dim:#8D97A8; --soft:#5A6373; --line:#252B37;
  --accent:#FF5A3C; --accentSoft:#FF5A3C22; --ok:#4ADE80; --warn:#FBBF24; --bad:#F43F5E;
  --pad:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4;
  overflow-wrap:break-word;
}
/* overflow-x:hidden тут ставить нельзя: он ломает position:sticky у шапки и таймера */
body{min-height:100vh;padding-top:env(safe-area-inset-top)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:inherit}
::-webkit-scrollbar{display:none}
h1{font-weight:800;letter-spacing:-.02em}
b{font-weight:700}

.scr{max-width:520px;margin:0 auto;padding:0 var(--pad) 90px}
.sp{height:24px}
.pad{padding-left:4px}

/* ── шапки ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 2px 14px}
.top-hi{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.top-d{font-size:13px;color:var(--dim);margin-top:3px}
.hdr{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px;padding:14px 0 12px;
  position:sticky;top:0;background:var(--bg);z-index:20}
.hdr-t{text-align:center;min-width:0}
.hdr-title{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-sub{font-size:12px;color:var(--dim);margin-top:1px}
.hdr-r{display:flex;justify-content:flex-end}
.ic{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ic.sm{width:32px;height:32px;font-size:16px}
.ic-sp{width:40px}

/* ── карточки ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;
  width:100%;text-align:left;display:block}
.lbl{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;
  font-weight:700;margin-bottom:8px}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin:6px 0}
.cue{font-size:13px;color:var(--text);background:var(--cardDim);border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.45}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.kv b{color:var(--text)}
.mini{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  background:var(--accentSoft);color:var(--accent);padding:2px 6px;border-radius:5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--cardDim)}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.dim{color:var(--dim)}

/* ── кнопки ── */
.btn{width:100%;background:var(--accent);color:#fff;padding:15px;border-radius:13px;font-size:15px;
  font-weight:700;margin-top:10px;display:block;text-align:center}
.btn.ghost{background:var(--cardDim);color:var(--text);border:1px solid var(--line)}
.btn.flat{background:none;color:var(--dim);font-weight:500;font-size:13px;padding:11px}
.inp{width:100%;background:var(--cardDim);border:1px solid var(--line);border-radius:11px;
  padding:13px 12px;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--accent)}
.ta{min-height:80px;line-height:1.5;resize:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── онбординг ── */
.onb{max-width:380px;margin:0 auto;padding:60px 24px;text-align:center}
.onb-logo{width:76px;height:76px;margin:0 auto;border-radius:22px;font-size:38px;
  background:linear-gradient(135deg,var(--accent),#B93A22);display:flex;align-items:center;justify-content:center}
.onb-h1{font-size:32px;margin:16px 0 4px}
.onb-p{font-size:14px;color:var(--dim);margin-bottom:28px}
.onb-card{text-align:left}
.onb-foot{font-size:12px;color:var(--soft);margin-top:24px;line-height:1.8}

/* ── плитки старта ── */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc);
  border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile-i{font-size:24px;line-height:1}
.tile-n{font-size:12px;font-weight:600}

/* ── живая сессия ── */
.live{border-color:var(--accent);background:linear-gradient(160deg,var(--accentSoft),var(--card))}
.live-l{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.9px;
  display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:4px;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-n{font-size:19px;font-weight:800;margin:5px 0 2px}
.live-s{font-size:13px;color:var(--dim)}

/* ── флаги и план ── */
.flags{border-color:var(--warn)}
.flag{font-size:13px;line-height:1.5;padding:7px 0;border-top:1px solid var(--line)}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan-n{font-size:14px;font-weight:700}
.plan-i{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.plan-t{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.plan-note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}

/* ── неделя ── */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;margin-bottom:10px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk-bars{display:flex;gap:2px;align-items:flex-end;height:56px}
.wk-bar{width:7px;border-radius:3px;background:var(--accent)}
.wk-bar.empty{background:var(--line)}
.wk-n{font-size:10px;color:var(--dim);font-weight:600}
.wk-d.now .wk-n{color:var(--accent)}
.wk-p{font-size:10px;height:13px;line-height:13px}
.wk-sum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.wk-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.wk-l{font-size:11px;color:var(--dim);margin-top:3px}

/* ── строка сессии ── */
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.srow-i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0}
.srow-b{flex:1;min-width:0}
.srow-n{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-s{font-size:12px;color:var(--dim);margin-top:2px}
.srow-l{font-size:15px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}

/* ── вес ── */
.wcard{display:flex;justify-content:space-between;align-items:center}
.wcard-v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.wcard-v span{font-size:13px;color:var(--dim);font-weight:600}
.wcard-d{font-size:12px;color:var(--dim)}
.wrow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}
.chart{width:100%;height:70px;display:block;overflow:visible}

/* ── упражнение в сессии ── */
.ex{padding:0;overflow:hidden}
.ex.open{border-color:var(--accent)}
.ex-h{display:flex;align-items:center;gap:10px;padding:14px;width:100%;text-align:left}
.ex-hb{flex:1;min-width:0}
.ex-n{font-size:15px;font-weight:700}
.ex-s{font-size:12px;color:var(--dim);margin-top:2px}
.ex-c{width:30px;height:30px;border-radius:9px;background:var(--cardDim);display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:800;color:var(--dim);flex-shrink:0}
.ex.open .ex-c{background:var(--accent);color:#fff}
.sets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.set{display:flex;align-items:baseline;gap:3px;background:var(--cardDim);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-variant-numeric:tabular-nums}
.set-n{font-size:10px;color:var(--soft);font-weight:700;margin-right:2px}
.set-w,.set-r{font-size:14px;font-weight:700}
.set-u{font-size:10px;color:var(--dim)}
.set-rir{font-size:10px;color:var(--accent);font-weight:700;margin-left:3px}
.pane{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.sug{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:12px}

/* ── степперы ── */
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;margin-bottom:10px}
.st-b{height:56px;border-radius:13px;background:var(--cardDim);border:1px solid var(--line);
  font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center}
.st-b:active{background:var(--accent);color:#fff}
.st-v{height:56px;background:var(--cardDim);border-radius:13px;display:flex;align-items:baseline;
  justify-content:center;gap:5px;padding-top:12px}
.st-v span{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.st-v small{font-size:12px;color:var(--dim);font-weight:600}
.rirs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.rir{height:46px;border-radius:11px;background:var(--cardDim);border:1px solid var(--line);
  font-size:16px;font-weight:700}
.rir.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rir-h{font-size:11px;color:var(--dim);text-align:center;margin-bottom:4px}

/* ── быстрая сессия ── */
.qcard{text-align:center}
.qbig{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.qlbl{font-size:12px;color:var(--dim);margin:4px 0 18px}
.qcard .lbl,.qcard .row2{text-align:left}

/* ── RPE ── */
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.rpe-b{height:50px;border-radius:11px;background:var(--cardDim);border:1px solid var(--line);
  font-size:16px;font-weight:700}
.rpe-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rpe-l{text-align:center;font-size:14px;font-weight:700;margin-bottom:6px}
.rpe-load{text-align:center;font-size:12px;color:var(--dim);margin-bottom:14px}

/* ── отдых ── */
.rest{position:sticky;top:66px;z-index:19;background:var(--cardDim);border:1px solid var(--accent);
  border-radius:12px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;
  justify-content:space-between;font-size:14px;font-weight:700;overflow:hidden}
.rest.hide{display:none}
.rest-b{position:absolute;left:0;top:0;bottom:0;background:var(--accentSoft);transition:width 1s linear}
.rest span,.rest-x{position:relative;z-index:1}
.rest-x{font-size:12px;color:var(--dim);font-weight:500}

/* ── выбор упражнения ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.chip{padding:9px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:6px}
.prow-b{flex:1;min-width:0}
.prow-n{font-size:14px;font-weight:600}
.prow-s{font-size:11px;color:var(--dim);margin-top:2px}
.prow-a{width:30px;height:30px;border-radius:9px;background:var(--accentSoft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0}

/* ── календарь ── */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-t{font-size:15px;font-weight:700}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.cal-w div{text-align:center;font-size:10px;color:var(--dim);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:13px;color:var(--dim);border:1.5px solid transparent}
.cal-d.has{background:var(--cardDim);color:var(--text);font-weight:700}
.cal-d.today{border-color:var(--accent);color:var(--accent)}
.cal-dots{display:flex;gap:2px;height:5px}
.cal-dots i{width:4px;height:4px;border-radius:2px}

/* ── прогресс ── */
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;margin-bottom:8px}
.bar-c{display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-v{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums;height:12px}
.bar{width:100%;background:var(--accent);border-radius:4px;min-height:3px}
.bar-l{font-size:9px;color:var(--soft)}
.ratio{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.ratio-v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.ratio-v.ok{color:var(--ok)} .ratio-v.warn{color:var(--warn)}
.ratio-v.bad{color:var(--bad)} .ratio-v.dim{color:var(--dim)}
.ratio-t{font-size:11px;color:var(--dim);line-height:1.5}
.tr{display:grid;grid-template-columns:100px 1fr 38px;gap:8px;align-items:center;padding:6px 0;font-size:12px}
.tr-bar{height:7px;background:var(--cardDim);border-radius:4px;overflow:hidden}
.tr-bar i{display:block;height:100%;border-radius:4px}
.tr-v{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
  border-top:1px solid var(--line);width:100%;text-align:left}
.pr-n{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-v small{color:var(--dim);font-weight:600}
.hrow{display:flex;gap:12px;align-items:center;padding:10px 14px}
.hrow-d{font-size:12px;color:var(--dim);width:64px;flex-shrink:0}
.hrow-s{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.hrow-s span{background:var(--cardDim);border-radius:7px;padding:3px 7px}
.hrow-s i{color:var(--accent);font-style:normal;font-size:10px;margin-left:3px}

/* ── нижняя навигация ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
.nav-b{padding:9px 0 8px;font-size:10px;font-weight:600;color:var(--soft);display:flex;
  flex-direction:column;align-items:center;gap:3px}
.nav-b.on{color:var(--accent)}
.nav-i{font-size:17px;line-height:1}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
